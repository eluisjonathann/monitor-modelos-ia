name: Actualizar Leaderboard de Modelos IA

on:
  schedule:
    # Ejecución automática 3 veces al día (03:00, 11:00 y 19:00 UTC)
    # Equivalente a 10:00 PM, 6:00 AM y 2:00 PM hora Perú (UTC-5)
    - cron: '0 3,11,19 * * *'
  workflow_dispatch: # Botón manual para ejecutar cuando desees

# Evita ejecuciones simultáneas conflictivas
concurrency:
  group: leaderboard-updater
  cancel-in-progress: false

jobs:
  scrape-and-update:
    name: Extraer, Probar y Actualizar Leaderboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD_MODELOS_IA.md README.md
          if git diff --staged --quiet; then
            echo "Sin cambios detectados en esta ejecución."
            echo "### ℹ️ Estado: Sin cambios en los leaderboards" >> $GITHUB_STEP_SUMMARY
          else
            git commit -m "Auto-actualización de Leaderboard [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
            echo "### 🚀 Estado: Leaderboards actualizados y desplegados con éxito" >> $GITHUB_STEP_SUMMARY
          fi
